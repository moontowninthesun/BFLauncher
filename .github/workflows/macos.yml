name: Native macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core self-tests
        run: Scripts/run-self-tests.sh

      - name: Build Universal app
        run: Scripts/build-macos-app.sh dist

      - name: Verify architectures and signature
        run: |
          lipo -archs dist/BFLauncher.app/Contents/MacOS/BFLauncher
          codesign --verify --deep --strict dist/BFLauncher.app

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/BFLauncher.app BFLauncher-macOS-universal.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BFLauncher-macOS-universal
          path: BFLauncher-macOS-universal.zip
